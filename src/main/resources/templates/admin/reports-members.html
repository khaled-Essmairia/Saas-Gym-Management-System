<!DOCTYPE html>
<!-- members-report.php -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gym System Admin')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<div id="content">
    <div th:replace="~{fragments/layout :: contentHeader('Members Report', 'View Reports', 'fas fa-file')}"></div>
    <div class="container-fluid">
        <hr/>
        <div class="row-fluid">
            <div class="span12">
                <div class="widget-box">
                    <div class="widget-title"><span class="icon"><i class="fas fa-th"></i></span><h5>Member table</h5></div>
                    <div class="widget-content nopadding" data-pager>

                        <!-- Toolbar: page size + search -->
                        <div class="table-toolbar">
                            <label>Show
                                <select data-role="size">
                                    <option value="5">5</option>
                                    <option value="10" selected>10</option>
                                    <option value="15">15</option>
                                    <option value="20">20</option>
                                </select> entries
                            </label>
                            <label>Search:
                                <input type="text" data-role="search" placeholder="Name, service..."/>
                            </label>
                        </div>

                        <table class="table table-bordered table-hover">
                            <thead><tr><th>#</th><th>Fullname</th><th>Choosen Service</th><th>Action</th></tr></thead>
                            <tbody>
                            <tr th:each="m, it : ${members}">
                                <td><div class="text-center" th:text="${it.count}">1</div></td>
                                <td><div class="text-center" th:text="${m.fullname}">Name</div></td>
                                <td><div class="text-center" th:text="${m.services}">Fitness</div></td>
                                <td data-nosearch><div class="text-center">
                                    <a th:href="@{/admin/reports/members/{id}(id=${m.userId})}"><i class="fas fa-file"></i> View Report</a>
                                </div></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(members)}" data-pager-ignore>
                                <td colspan="4" class="empty-state">No members yet.</td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- Footer: info + page buttons -->
                        <div class="table-footer">
                            <div data-role="info"></div>
                            <div data-role="nav"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script th:src="@{/js/table-pager.js}"></script>
</body>
</html>
