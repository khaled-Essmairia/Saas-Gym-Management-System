spring.application.name=gym-system
server.port=8081

#password = codeastro.com
#username = admin

# ---------------------------------------------------------------
# Database - same MySQL database as the PHP project ("gymnsb")
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/gymnsb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The existing tables are used as they are: Hibernate never creates/drops tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Small, idempotent fixes applied at startup so the old PHP schema works with
# strict MySQL (nullable dates, wider password column for BCrypt, etc.).
# See src/main/resources/db/schema-fix.sql. Set to "never" to disable.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-fix.sql
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------
# Gym settings
# ---------------------------------------------------------------
# Time zone used for attendance check-in and payment dates
# (the PHP version used Asia/Kathmandu).
gym.timezone=Africa/Lagos
gym.name=Perfect GYM Club
gym.address=5021 Wetzel Lane, Williamsburg
gym.phone=231-267-6011
gym.email=support@perfectgym.com

