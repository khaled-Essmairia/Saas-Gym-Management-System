<!DOCTYPE html>
<!-- payment.php + search-result.php -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gym System')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<div id="content">
    <div th:replace="~{fragments/layout :: contentHeader('Payments', 'Registered Member\'s Payment', 'fas fa-users')}"></div>
    <div class="container-fluid">
        <hr/>
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>
        <div class="row-fluid">
            <div class="span12">


                <div class="widget-box" th:if="${searching and #lists.isEmpty(members)}">
                    <div class="widget-title"><span class="icon"><i class="fas fa-info"></i></span><h5>Error Message</h5></div>
                    <div class="widget-content">
                        <div class="error_ex">
                            <h1>403</h1>
                            <h3>Opps, Results Not Found!!</h3>
                            <p>It seems like there's no such record available in our database.</p>
                            <a class="btn btn-danger btn-big" th:href="@{/{a}/payments(a=${area})}">Go Back</a>
                        </div>
                    </div>
                </div>

                <div class="widget-box" th:unless="${searching and #lists.isEmpty(members)}">
                    <div class="widget-title"><span class="icon"><i class="fas fa-th"></i></span><h5>Member's Payment table</h5></div>
                    <div class="widget-content nopadding" data-pager>

                        <!-- Toolbar: page size + filter -->
                        <div class="table-toolbar">
                            <label>Show
                                <select data-role="size">
                                    <option value="5">5</option>
                                    <option value="10" selected>10</option>
                                    <option value="15">15</option>
                                    <option value="20">20</option>
                                </select> entries
                            </label>
                            <label>Filter:
                                <input type="text" data-role="search" placeholder="Name, date, service, plan..."/>
                            </label>
                        </div>

                        <table class="table table-bordered table-hover">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Member</th>
                                <th>Last Payment Date</th>
                                <th>Amount</th>
                                <th>Choosen Service</th>
                                <th>Plan</th>
                                <th>Action</th>
                                <th>Remind</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="m, it : ${members}">
                                <td><div class="text-center" th:text="${it.count}">1</div></td>
                                <td><div class="text-center" th:text="${m.fullname}">Name</div></td>
                                <td><div class="text-center" th:text="${m.paidDate != null ? m.paidDate : 'New Member'}">date</div></td>
                                <td><div class="text-center" th:text="'$' + ${m.amount}">$0</div></td>
                                <td><div class="text-center" th:text="${m.services}">Fitness</div></td>
                                <td><div class="text-center" th:text="${m.plan} + ' Month/s'">1 Month/s</div></td>
                                <td data-nosearch>
                                    <div class="text-center">
                                        <a th:href="@{/{a}/payments/{id}(a=${area},id=${m.userId})}" class="btn btn-success">
                                            <i class="fas fa-dollar-sign"></i> Make Payment</a>
                                    </div>
                                </td>
                                <td data-nosearch>
                                    <div class="text-center">
                                        <form class="inline-form" method="post"
                                              th:action="@{/{a}/payments/{id}/remind(a=${area},id=${m.userId})}">
                                            <button type="submit" class="btn btn-danger" th:disabled="${m.reminderSent}"
                                                    th:title="${m.reminderSent ? 'Reminder already sent' : 'Send a payment reminder'}">Alert</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(members)}" data-pager-ignore>
                                <td colspan="8" class="empty-state">No members yet.</td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- Footer: info + page buttons -->
                        <div class="table-footer">
                            <div data-role="info"></div>
                            <div data-role="nav"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script th:src="@{/js/table-pager.js}"></script>
</body>
</html>
