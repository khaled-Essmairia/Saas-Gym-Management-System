<!DOCTYPE html>
<!-- customer/pages/my-report.php -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gym System')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<div id="content">
    <div th:replace="~{fragments/layout :: contentHeader('Reports', 'My Report', 'fas fa-file')}"></div>
    <div class="container-fluid">
        <hr/>
        <div class="row-fluid">
            <div class="span12">
                <div th:replace="~{fragments/report :: member(${member}, true)}"></div>
                <th:block th:if="${member.iniWeight > 0 or member.currWeight > 0}">
                    <div th:replace="~{fragments/report :: progress(${member})}"></div>
                </th:block>
                <div class="text-center no-print">
                    <button class="btn btn-danger" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
